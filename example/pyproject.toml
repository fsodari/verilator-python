[build-system]
# verilator-dspsim must be a build requirement. Builds run in an isolated environment,
# so find_package(verilator) can't see a verilator that is only installed in your own environment.
requires = ["scikit-build-core>=0.10.6", "nanobind>=2.2.0", "verilator-dspsim>=5.52.2"]
build-backend = "scikit_build_core.build"

[project]
name = "example"
version = "0.0.1"

[tool.scikit-build]
cmake.build-type = "Release"

# Install the package
# pip install .

# Run the example
# python -c "import example;example.run_simulation()"
