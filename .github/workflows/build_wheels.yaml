name: Build

on:
  push:
    branches:
      - releases/*
      - main
    tags:
      - 'v*'
  # Started on a tag by check_verilator.yaml, or manually.
  workflow_dispatch:

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  WIN_FLEX_BISON: ${{ github.workspace }}/.ccache/winflexbison/install
jobs:
  build_sdist:
    name: Build source distribution
    runs-on: ["ubuntu-latest"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Build sdist
        run: uv build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: ./dist/*

  build_windows_wheels:
    name: Python cibuildwheel windows
    runs-on: ["windows-latest"]

    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install winflexbison
        run: "powershell ./scripts/win-install-winflexbison.ps1"

      - name: Build Windows wheels
        run: uvx cibuildwheel --output-dir ./dist

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-windows
          path: ./dist/*.whl

  build_linux_wheels:
    name: Python cibuildwheel linux
    runs-on: ["ubuntu-latest"]

    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Build Linux wheels
        run: uvx cibuildwheel --platform linux --output-dir ./dist

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-linux
          path: ./dist/*.whl

  build_macos_wheels:
    name: Python cibuildwheel ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # cibuildwheel builds for the architecture of the runner.
        # macos-latest: arm64, macos-15-intel: x86_64
        os: [macos-latest, macos-15-intel]

    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Build macOS wheels
        run: uvx cibuildwheel --platform macos --output-dir ./dist

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./dist/*.whl

  upload_pypi:
    # github.ref is the tag for both tag pushes and workflow_dispatch on a tag.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build_linux_wheels, build_windows_wheels, build_macos_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/verilator-dspsim
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: publish distribution to pypi.org
        uses: pypa/gh-action-pypi-publish@release/v1