name: Check Verilator release

# Poll for new verilator releases. When there is one, bump the version in pyproject.toml,
# tag it, and start the Build workflow on the tag, which publishes to pypi.org.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Only report what would be released"
        type: boolean
        default: false

permissions:
  # Push the version bump and tag.
  contents: write
  # Start the Build workflow.
  actions: write

concurrency:
  group: check-verilator-release

jobs:
  check_release:
    name: Check for a new verilator release
    runs-on: ["ubuntu-latest"]
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Check for a new release
        id: check
        run: python scripts/check_verilator_release.py ${{ inputs.dry-run && '--dry-run' || '' }}

      - name: Bump version and tag
        if: steps.check.outputs.release == 'true' && !inputs.dry-run
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          uv lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Verilator v$VERSION"
          git tag "v$VERSION"
          git push --atomic origin "HEAD:$DEFAULT_BRANCH" "v$VERSION"

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the build explicitly.
      - name: Build and publish
        if: steps.check.outputs.release == 'true' && !inputs.dry-run
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: gh workflow run build_wheels.yaml --ref "v$VERSION"
